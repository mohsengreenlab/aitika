name: 'aitika_api_test'

services:
  postgres:
    image: postgres:17
    container_name: postgres_test
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PW}
    ports:
      - '${DB_PORT:-5432}:5432'

